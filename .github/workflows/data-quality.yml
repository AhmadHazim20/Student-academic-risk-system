
name: Assignment 2 - Data Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-quality:
    name: Validate DataOps Package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assignment-2-dataops

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify committed release identity
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          releases = [
              (
                  "metadata/releases/manifest-1.0.0.json",
                  "metadata/releases/lineage-1.0.0.json",
                  120
              ),
              (
                  "metadata/dataset_manifest.json",
                  "metadata/lineage.json",
                  123
              )
          ]

          for manifest_file, lineage_file, expected_rows in releases:
              manifest = json.loads(Path(manifest_file).read_text())
              lineage = json.loads(Path(lineage_file).read_text())

              for kind in ["source", "processed"]:
                  path = Path(manifest[f"{kind}_identifier"])
                  assert path.is_file(), f"Missing: {path}"

                  actual_hash = hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()

                  assert actual_hash == manifest[f"{kind}_sha256"], (
                      f"Checksum mismatch: {path}"
                  )

              source = Path(manifest["source_identifier"])

              with source.open(newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))

              assert len(rows) == expected_rows
              assert manifest["row_count"] == expected_rows
              assert dict(Counter(
                  row["risk_label"] for row in rows
              )) == manifest["class_distribution"]

              assert lineage["release_id"] == manifest["release_id"]
              assert lineage["source_sha256"] == manifest["source_sha256"]
              assert lineage["processed_sha256"] == manifest["processed_sha256"]
              assert len(lineage["steps"]) == 2

              print("PASS:", manifest["release_id"])

          print("PASS: Release identity and lineage verified.")
          PY

      - name: Run data ingestion
        run: python src/ingest.py

      - name: Run data preprocessing
        run: python src/preprocess.py

      - name: Run automated data quality tests
        run: |
          python -m unittest discover -s tests -p "test_data_quality.py" -v 2>&1 | tee ci-validation-evidence.txt

      - name: Build and validate both dataset releases
        run: python src/build_releases.py

      - name: Verify dataset reproducibility
        run: |
          git diff --exit-code -- \
            data/raw/synthetic_dataset.csv \
            data/raw/synthetic_dataset_v1.1.0.csv \
            data/processed/controlled_dataset.csv \
            data/processed/controlled_dataset_v1.1.0.csv

          echo "PASS: Rebuilt datasets match committed releases."

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment2-data-quality-evidence
          path: assignment-2-dataops/ci-validation-evidence.txt
          if-no-files-found: warn
